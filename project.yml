name: Aufraeumer
options:
  bundleIdPrefix: com.mk76reuzer
  deploymentTarget:
    iOS: "17.0"
packages:
  AufraeumerKern:
    path: .
schemes:
  Aufraeumer:
    build:
      targets:
        Aufraeumer: all
        AufraeumerUITests: [test]
    test:
      targets:
        - AufraeumerUITests

targets:
  Aufraeumer:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AufraeumerKern
        product: AufraeumerKern
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aufräumer
        NSPhotoLibraryUsageDescription: "Der Aufräumer zeigt dir große und überflüssige Fotos und Videos und löscht nur, was du ausdrücklich bestätigst."
        NSPhotoLibraryAddUsageDescription: "Verkleinerte Videos werden in deiner Fotomediathek gespeichert."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mk76reuzer.aufraeumer
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "2"
  AufraeumerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Aufraeumer
    settings:
      base:
        SWIFT_VERSION: "5.9"
